<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Karim's Talking Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one calm screen, four big picture cards in a 2x2 grid, a small grown-up bar at the bottom. Single soft-light look by choice. */
:root{
  --bg:#EEF3F1; --card:#FFFFFF; --ink:#23413A; --soft:#6B8A82;
  --ring:#3E8E7E; --glow:#D5ECE5; --line:#D3E0DB;
  --c1:#FCE9D2; --c2:#DCEAF7; --c3:#D6F0F0; --c4:#F3E3EF;
  --font:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.card{position:relative;border:4px solid transparent;border-radius:28px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px;cursor:pointer;min-height:0;overflow:hidden;font:inherit;color:inherit;
  box-shadow:0 2px 0 var(--line);transition:border-color .25s, background-color .25s}
.card:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.card.active{border-color:var(--ring);background:var(--glow)}
.pic{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:20px}
.pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px}
.pic .emo{font-size:clamp(64px,16vmin,180px);line-height:1}
.ru{font-weight:800;font-size:clamp(22px,4.6vmin,46px);text-align:center;text-wrap:balance}
.en{font-weight:600;font-size:clamp(13px,2.2vmin,20px);color:var(--soft)}
.hide-en .en{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tools{display:none;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
.grown .tools{display:flex}
.tools label{font-size:13px;font-weight:700;border:2px dashed var(--line);border-radius:12px;padding:6px 10px;cursor:pointer;background:var(--bg)}
.tools input{display:none}
.note{font-size:14px;color:var(--soft);flex-basis:100%;text-align:center}
.note:empty{display:none}
@media (max-width:420px){.grid{gap:10px}.card{border-radius:20px;padding:8px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<main class="grid" id="grid" aria-label="Talking cards"></main>
<div class="bar">
  <button class="btn" id="steps" type="button">▶ Play the steps</button>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="enBtn" type="button">English labels</button>
    <button class="btn" id="fsBtn" type="button">Full screen</button>
    <button class="btn" id="grownBtn" type="button">Grown-up mode</button>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
const CARDS = [
  {id:"out",   emo:"🚪", ru:"Пойдём гулять!", key:"Гулять",  en:"Let's go out",       bg:"--c1"},
  {id:"shoes", emo:"👟", ru:"Надень ботинки", key:"Ботинки", en:"Wear your shoes",    bg:"--c2"},
  {id:"swim",  emo:"🏊", ru:"Пойдём плавать!", key:"Плавать", en:"Let's go swimming", bg:"--c3"},
  {id:"eat",   emo:"🍽️", ru:"Давай кушать!", key:"Кушать",  en:"Let's eat",          bg:"--c4"},
];
const store = {
  get(k){ try { return localStorage.getItem("kc_"+k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem("kc_"+k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem("kc_"+k); } catch(e){} }
};
const grid = document.getElementById("grid"), note = document.getElementById("note");
let tts = null, ruVoice = null, busy = false, audioEl = null;

function render(){
  grid.innerHTML = "";
  CARDS.forEach(c => {
    const b = document.createElement("div");
    b.className = "card"; b.setAttribute("role","button"); b.tabIndex = 0; b.id = "card-"+c.id; b.dataset.id = c.id;
    b.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target === b) { e.preventDefault(); say(c); } });
    const photo = store.get("img_"+c.id), voice = store.get("aud_"+c.id);
    b.innerHTML = `
      <div class="pic" style="background:var(${c.bg})">${photo ? `<img alt="">` : `<span class="emo" aria-hidden="true">${c.emo}</span>`}</div>
      <div class="ru"></div><div class="en"></div>
      <div class="tools">
        <label>📷 Photo<input type="file" accept="image/*" data-kind="img"></label>
        <label>🎙 Mom's voice${voice ? " ✓" : ""}<input type="file" accept="audio/*" capture data-kind="aud"></label>
        ${photo||voice ? `<label data-reset="1">Reset</label>` : ""}
      </div>`;
    if (photo) b.querySelector("img").src = photo;
    b.querySelector(".ru").textContent = c.ru;
    b.querySelector(".en").textContent = c.en;
    b.querySelector(".pic img")?.setAttribute("alt", c.en);
    b.addEventListener("click", e => {
      if (e.target.closest(".tools")) {
        if (e.target.closest("[data-reset]")) { store.del("img_"+c.id); store.del("aud_"+c.id); render(); }
        e.stopPropagation(); return;
      }
      say(c);
    });
    b.querySelectorAll("input").forEach(inp => inp.addEventListener("change", ev => upload(c, ev.target)));
    grid.appendChild(b);
  });
}

function upload(c, inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  if (inp.dataset.kind === "img") {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 700 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = img.width*s; cv.height = img.height*s;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      if (!store.set("img_"+c.id, cv.toDataURL("image/jpeg", .82))) note.textContent = "The photo could not be saved on this device. Try a smaller one.";
      URL.revokeObjectURL(url); render();
    };
    img.src = url;
  } else {
    if (f.size > 1.5e6) { note.textContent = "That recording is too long. Keep it under about 10 seconds."; return; }
    const r = new FileReader();
    r.onload = () => { if (!store.set("aud_"+c.id, r.result)) note.textContent = "The voice could not be saved on this device. Try a shorter recording."; render(); };
    r.readAsDataURL(f);
  }
}

function mark(id){
  document.querySelectorAll(".card").forEach(x => x.classList.toggle("active", x.dataset.id === id));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function speak(c){
  const rec = store.get("aud_"+c.id);
  if (rec) {
    if (audioEl) audioEl.pause();
    audioEl = new Audio(rec);
    await new Promise(res => { audioEl.onended = res; audioEl.onerror = res; audioEl.play().catch(res); });
    return;
  }
  if (tts) {
    try {
      await tts.speak([{text:c.ru, language:"ru", rate:0.75}, {text:c.key + ".", language:"ru", rate:0.7}]);
      return;
    } catch(e) { if (e && e.code === "viewer_stopped") return; }
  }
  if ("speechSynthesis" in window && ruVoice) {
    speechSynthesis.cancel();
    for (const t of [c.ru, c.key]) {
      await new Promise(res => {
        const u = new SpeechSynthesisUtterance(t); u.voice = ruVoice; u.lang = "ru-RU"; u.rate = 0.7;
        u.onend = res; u.onerror = res; speechSynthesis.speak(u);
      });
      await wait(700);
    }
    return;
  }
  note.textContent = "No Russian voice on this device. Turn on Grown-up mode and add Mom's voice for each card.";
  await wait(1500);
}

async function say(c){
  if (busy) return;
  busy = true; mark(c.id);
  try { await speak(c); } finally { await wait(400); mark(null); busy = false; }
}

document.getElementById("steps").addEventListener("click", async () => {
  if (busy) return;
  for (const id of ["out","shoes","swim"]) { await say(CARDS.find(c => c.id === id)); await wait(1500); }
});
document.getElementById("enBtn").addEventListener("click", e => {
  const off = document.body.classList.toggle("hide-en"); e.currentTarget.classList.toggle("on", !off); store.set("en", off ? "0" : "1");
});
document.getElementById("grownBtn").addEventListener("click", e => {
  const on = document.body.classList.toggle("grown"); e.currentTarget.classList.toggle("on", on);
  note.textContent = on ? "Tap 📷 to use a real photo of his things. Tap 🎙 to add a short recording of Mom saying the words slowly." : "";
});
document.getElementById("fsBtn").addEventListener("click", () => {
  const el = document.documentElement;
  (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).catch(() => { note.textContent = "Full screen is not available here."; });
});

function pickVoice(){
  try { const v = speechSynthesis.getVoices(); ruVoice = v.find(x => /^ru/i.test(x.lang)) || null; } catch(e){}
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
if (store.get("en") === "0") document.body.classList.add("hide-en"); else document.getElementById("enBtn").classList.add("on");
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); } catch(e){}
render();
(window.claude && window.claude.use ? window.claude.use("tts") : Promise.resolve(null)).then(t => { tts = t; }).catch(() => {});
</script>

</body></html>
