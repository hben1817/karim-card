<style>
/* Layout: one calm screen. Child view = cards (one big card, or a grid) plus a slim bar.
   Parent view = a full-screen panel opened by holding the Parents button. Single soft-light look by choice. */
:root{
  --bg:#EEF3F1; --card:#FFFFFF; --ink:#23413A; --soft:#5F7F77;
  --ring:#3E8E7E; --glow:#D5ECE5; --line:#D3E0DB; --warn:#B4532A;
  --c1:#FCE9D2; --c2:#DCEAF7; --c3:#D6F0F0; --c4:#F3E3EF; --c5:#E6F1D6; --c6:#FBE4E0;
  --font:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none}

/* ---------- child view ---------- */
.stage{flex:1;min-height:0;min-width:0;position:relative}
.grid{height:100%;display:grid;gap:12px;overflow-y:auto;overscroll-behavior:contain;align-content:start}
.one{height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:stretch}
.card{position:relative;border:4px solid transparent;border-radius:26px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px;cursor:pointer;min-height:0;min-width:0;overflow:hidden;
  box-shadow:0 2px 0 var(--line);transition:border-color .25s,background-color .25s}
.card:focus-visible{outline:4px solid var(--ring);outline-offset:-4px}
.card.active{border-color:var(--ring);background:var(--glow)}
.pic{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:18px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .emo{line-height:1;font-size:min(22vmin,150px)}
.one .pic .emo{font-size:min(46vmin,340px)}
.ru{font-weight:800;text-align:center;text-wrap:balance;line-height:1.25;flex:none;max-width:100%;overflow-wrap:anywhere;font-size:clamp(18px,4.2vmin,40px)}
.en{font-weight:600;color:var(--soft);text-align:center;flex:none;font-size:clamp(12px,2.1vmin,19px)}
.one .ru{font-size:clamp(26px,7vmin,72px)}
.one .en{font-size:clamp(14px,2.8vmin,26px)}
.hide-en .en{display:none}
.pair{height:100%;display:grid;gap:10px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr)}
.pair .mid{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--soft);font-size:clamp(14px,2.6vmin,22px);text-align:center}
.pair .mid b{font-size:clamp(26px,5vmin,48px);color:var(--ring);line-height:1}
.pair .card .tagc{position:absolute;top:8px;left:12px;font-weight:800;font-size:clamp(12px,2.2vmin,18px);color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.pair .card.dim{opacity:.35}
.pair .card.big{border-color:var(--ring)}
.pair .ru{font-size:clamp(22px,5.6vmin,56px)}
.pair .pic .emo{font-size:min(30vmin,260px)}
.ar-h{display:none}@media (min-aspect-ratio:11/10){.ar-h{display:inline}.ar-v{display:none}}
.pair .ask{max-width:16ch;line-height:1.25}
.ask{font-weight:800;text-align:center;font-size:clamp(14px,2.6vmin,22px);color:var(--soft);min-height:1.2em}
@media (min-aspect-ratio:11/10){.pair{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:1fr}.pair .mid{flex-direction:column}}
.menu{position:absolute;inset:0;z-index:6;background:var(--bg);display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.menu button{border:4px solid transparent;border-radius:26px;background:var(--card);box-shadow:0 2px 0 var(--line);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:800;font-size:clamp(18px,4vmin,34px);text-align:center;min-width:0}
.menu button.on{border-color:var(--ring);background:var(--glow)}
.menu button span{font-size:clamp(40px,11vmin,96px);line-height:1}
.menu button small{font-weight:600;font-size:clamp(12px,2vmin,17px);color:var(--soft)}
.menu button:focus-visible{outline:4px solid var(--ring);outline-offset:-4px}
.menu button:disabled{opacity:.35;cursor:default}
.lbl{margin-left:4px}
@media (max-width:440px){.lbl{display:none}.btn{padding:8px 12px}}
.tip{font-size:13.5px;color:var(--soft);line-height:1.35;margin:4px 0 0}
.coach{background:var(--glow);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.45}
.coach ol{margin:6px 0 0;padding-left:20px}
.field select,.field textarea{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;background:var(--bg);width:100%;min-width:0}
.field textarea{resize:vertical;min-height:70px;font-family:inherit}
.field select:focus,.field textarea:focus{outline:3px solid var(--ring);outline-offset:1px;border-color:var(--ring)}
.badge{display:inline-block;font-size:12px;font-weight:800;background:var(--glow);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.nav{width:clamp(44px,9vmin,84px);border:0;border-radius:22px;background:var(--card);box-shadow:0 2px 0 var(--line);
  font-size:clamp(28px,6vmin,56px);font-weight:800;cursor:pointer;color:var(--ring);display:flex;align-items:center;justify-content:center}
.nav:focus-visible{outline:4px solid var(--ring)}
.nav:disabled{opacity:.25;cursor:default}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:nowrap;min-height:44px}
.dots{display:flex;gap:6px;flex:1 1 0;justify-content:center;min-width:0;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ring)}
.btn{font-weight:800;font-size:15px;border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 14px;cursor:pointer;white-space:nowrap;position:relative;overflow:hidden;min-height:44px;flex:none}
.btn:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.btn.on,.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{font-size:14px;padding:6px 11px;min-height:38px}
.hold::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--glow);z-index:0}
.hold.holding::after{width:100%;transition:width 1.2s linear}
.hold span{position:relative;z-index:1}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--ink);color:var(--card);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;max-width:92%;text-align:center;z-index:5}
@media (max-width:480px){.btn{font-size:13px;padding:8px 10px}.card{border-radius:20px;padding:8px}}

/* ---------- parent panel ---------- */
.panel{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-user-select:text;user-select:text;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.phead h1{font-size:24px;margin:0;font-weight:800;text-wrap:balance}
.sec{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line)}
.sec h2{font-size:17px;margin:0;font-weight:800}
.hint{font-size:14px;color:var(--soft);margin:0;line-height:1.4}
.field{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;min-width:0}
.field input[type=text]{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600;background:var(--bg);width:100%;min-width:0}
.field input[type=text]:focus{outline:3px solid var(--ring);outline-offset:1px;border-color:var(--ring)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:8px}
.thumb{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item b{display:block;overflow-wrap:anywhere}
.item small{color:var(--soft);font-weight:600}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ring)}
.emos{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.emos button{font-size:26px;border:2px solid var(--line);background:var(--bg);border-radius:12px;height:46px;cursor:pointer;padding:0}
.emos button.on{border-color:var(--ring);background:var(--glow)}
.prev{height:150px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:84px;overflow:hidden}
.prev img{width:100%;height:100%;object-fit:contain}
.rec{color:var(--warn);font-weight:800}
.filebtn input{display:none}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.hold.holding::after{transition:none}}
</style>
</head>

const DB = (() => {
  const mem = new Map(); let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("karim-cards", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction("kv", mode), s = t.objectStore("kv"); const q = fn(s);
      t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));

  if (!Array.isArray(S.set.choice)) S.set.choice = [];
  if (!Array.isArray(S.set.ft)) S.set.ft = [];
  if (!S.set.pairsSeeded) {                        // give Choice and First-Then a working example once

function layoutGrid(){
  const g = stage.querySelector(".grid"); if (!g) return;
  const W = stage.clientWidth, H = stage.clientHeight, n = visible().length, gap = 12;
  let cols = W < 560 ? 2 : W < 1000 ? 3 : 4;
  if (W > H * 1.2 && n <= 4) cols = n;                 // wide screen, few cards: one row
  else if (n <= 4) cols = n === 1 ? 1 : 2;             // tall screen, few cards: 2 by 2
  cols = Math.min(cols, n);
  const rows = Math.ceil(n / cols), rowsShown = Math.min(2, rows);

  const rowH = Math.max(120, Math.floor(rows > 2 ? (H - gap * 2) / 2.18 : (H - gap * (rowsShown - 1)) / rowsShown));
  g.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

}

  return new Promise(res => {

async function speak(c){

  if ("speechSynthesis" in window && ruVoice) {
    speechSynthesis.cancel();
    for (const txt of [c.ru, c.key && c.key.toLowerCase() !== c.ru.toLowerCase() ? c.key : ""].filter(Boolean)) {
      await new Promise(res => {
        const u = new SpeechSynthesisUtterance(txt); u.voice = ruVoice; u.lang = "ru-RU"; u.rate = 0.7;
        const guard = setTimeout(res, 8000);

  function pic(){
    const pv = $("ePrev"); pv.style.background = bg; pv.innerHTML = "";
    if (d.img) { const im = new Image(); im.src = d.img; im.alt = ""; pv.append(im); } else pv.textContent = d.emo;
    $("eNoPhoto").hidden = !d.img;
    $("eEmos").querySelectorAll("button").forEach(b => b.classList.toggle("on", !d.img && b.textContent === d.emo));
  }
  function voice(msg){
    $("ePlay").hidden = !d.aud; $("eNoAud").hidden = !d.aud;
    $("eVoiceMsg").textContent = msg || (d.aud ? t("hasVoice") : t("noVoiceYet"));
  }
  EMOJI.forEach(e => { const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.onclick = () => { d.emo = e; d.img = null; pic(); }; $("eEmos").append(b); });
  pic(); voice();
  $("ePhoto").onchange = e => { const f = e.target.files[0]; if (f) shrink(f).then(u => { d.img = u; pic(); }).catch(() => { $("eErr").textContent = t("badFile"); }); };
  $("eNoPhoto").onclick = () => { d.img = null; pic(); };
  $("eAud").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 3e6) { voice(t("tooBig")); return; }
    const r = new FileReader(); r.onload = () => { d.aud = r.result; voice(); }; r.readAsDataURL(f);
  };
  $("ePlay").onclick = () => { if (d.aud) playAudio(d.aud); };
  $("eNoAud").onclick = () => { d.aud = null; voice(); };
  $("eRec").onclick = async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(x => x.stop()); clearTimeout(rec._t); rec = null;
        if ($("eRec")) { $("eRec").textContent = t("record"); $("eRec").classList.remove("danger"); }
        const r = new FileReader(); r.onload = () => { d.aud = r.result; if ($("eVoiceMsg")) voice(); };
        r.readAsDataURL(new Blob(chunks, {type: chunks[0] ? chunks[0].type : "audio/webm"}));
      };
      rec.start(); rec._t = setTimeout(() => rec && rec.stop(), 15000);
      $("eRec").textContent = t("stop"); $("eRec").classList.add("danger"); voice(t("recording"));
    } catch (e) { rec = null; voice(t("micNo")); }
  };
  const leave = () => { if (rec) { try { rec.stop(); } catch(e){} } drawPanel(); };
  $("eCancel").onclick = leave;
  $("eSave").onclick = async () => {
    const ru = $("eRu").value.trim();
    if (!ru) { $("eErr").textContent = t("needPhrase"); $("eRu").focus(); return; }
    if (rec) { try { rec.stop(); } catch(e){} await wait(400); }
    const c = {id:d.id, ru, key:$("eKey").value.trim(), en:$("eEn").value.trim(), emo:d.emo, step:!!d.step, group:$("eGroup").value, tip:$("eTip").value.trim()};
    const i = S.cards.findIndex(x => x.id === c.id);
    if (i >= 0) S.cards[i] = c; else { S.cards.push(c); S.mode = c.group === "core" ? "words" : "cards"; S.cur = visible().length - 1; }
    if (d.img) { S.img[c.id] = d.img; await DB.set("img_" + c.id, d.img); } else { delete S.img[c.id]; DB.del("img_" + c.id); }
    if (d.aud) { S.aud[c.id] = d.aud; await DB.set("aud_" + c.id, d.aud); } else { delete S.aud[c.id]; DB.del("aud_" + c.id); }
    await saveCards(); drawPanel();
  };
  $("eRu").focus();
}
function shrink(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1100 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", .85));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

/* ---------------- backup ---------------- */
function exportAll(){
  const data = {app:"karim-cards", v:3, profile:S.profile, settings:S.set, cards:S.cards, img:S.img, aud:S.aud};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"}));
  a.download = "talking-cards-" + today() + ".json"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  $("pMsg").textContent = t("saved");
}
async function importAll(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "karim-cards" || !Array.isArray(data.cards)) throw 0;
    for (const c of S.cards) { DB.del("img_" + c.id); DB.del("aud_" + c.id); }
    S.cards = data.cards.filter(c => c && c.id && c.ru).map(c => ({id:String(c.id), ru:String(c.ru), key:String(c.key || ""), en:String(c.en || ""), emo:String(c.emo || "🙂"), step:!!c.step, group:c.group === "core" ? "core" : "cards", tip:String(c.tip || "")}));
    S.img = {}; S.aud = {};
    const ok = v => typeof v === "string" && /^data:(image|audio|video)\//.test(v);
    for (const c of S.cards) {
      if (data.img && ok(data.img[c.id])) { S.img[c.id] = data.img[c.id]; await DB.set("img_" + c.id, S.img[c.id]); }
      if (data.aud && ok(data.aud[c.id])) { S.aud[c.id] = data.aud[c.id]; await DB.set("aud_" + c.id, S.aud[c.id]); }
    }
    if (data.profile) { S.profile = {parent:String(data.profile.parent || ""), child:String(data.profile.child || "")}; await DB.set("profile", S.profile); }
    const ids = new Set(S.cards.map(c => c.id)), pick = a => (Array.isArray(a) ? a : []).filter(x => ids.has(x)).slice(0, 2);
    S.set.choice = pick(data.settings && data.settings.choice); S.set.ft = pick(data.settings && data.settings.ft); S.set.coreSeeded = true; S.set.pairsSeeded = true; await saveSet();
    await saveCards(); drawPanel(); $("pMsg").textContent = t("imported");
  } catch (e) { $("pMsg").textContent = t("badFile"); }
}

/* ---------------- wiring ---------------- */
$("viewBtn").onclick = () => { if (busy) return; S.set.view = S.set.view === "one" ? "all" : "one"; saveSet(); render(); };
$("stepsBtn").onclick = playSteps;
$("modeBtn").onclick = () => { if (!busy) toggleMenu(); };
(() => { // the Parents button opens only after a 1.2 second hold, so the child does not open it by accident
  const b = $("parentBtn"); let timer = null;
  const start = () => { b.classList.add("holding"); timer = setTimeout(() => { stop(); openPanel(); }, 1200); };
  const stop = () => { b.classList.remove("holding"); clearTimeout(timer); timer = null; };
  b.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => { if (timer) { stop(); toast(t("holdHint")); } }));
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("keydown", e => { if (e.key === "Enter") openPanel(); });
})();
(() => { // swipe left or right in one-card view
  let x0 = null, y0 = 0;
  stage.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; });
  stage.addEventListener("pointerup", e => {
    if (x0 == null || S.set.view !== "one" || S.mode === "choice" || S.mode === "next") { x0 = null; return; }
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  });
})();
document.addEventListener("keydown", e => {
  if (!panel.hidden || S.set.view !== "one" || S.mode === "choice" || S.mode === "next") return;
  if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1);
});
window.addEventListener("resize", layoutGrid);
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch(e){}
load().then(render, render);
</script>
